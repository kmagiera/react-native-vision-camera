name: Harness iOS Simulator (SimCam)

permissions:
  contents: read

concurrency:
  group: harness-ios-simcam-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harness-ios-simcam.yml"
      - "apps/simple-camera/**"
      - "packages/react-native-vision-camera/**"
      - "packages/react-native-vision-camera-barcode-scanner/**"
      - "packages/react-native-vision-camera-location/**"
      - "packages/react-native-vision-camera-resizer/**"
      - "packages/react-native-vision-camera-skia/**"
      - "packages/react-native-vision-camera-worklets/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
  pull_request:
    paths:
      - ".github/workflows/harness-ios-simcam.yml"
      - "apps/simple-camera/**"
      - "packages/react-native-vision-camera/**"
      - "packages/react-native-vision-camera-barcode-scanner/**"
      - "packages/react-native-vision-camera-location/**"
      - "packages/react-native-vision-camera-resizer/**"
      - "packages/react-native-vision-camera-skia/**"
      - "packages/react-native-vision-camera-worklets/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"

env:
  HARNESS_PROJECT_ROOT: apps/simple-camera
  HARNESS_APP_PATH: ios/build/harness/DerivedData/Build/Products/Debug-iphonesimulator/SimpleCamera.app
  HARNESS_IOS_BUNDLE_ID: com.margelo.nitro.camera.example.simple
  HARNESS_IOS_DEVICE_MODE: simulator
  HARNESS_IOS_SIMULATOR: iPhone 17 Pro
  HARNESS_IOS_SIMULATOR_VERSION: "26.5"
  HARNESS_IOS_METRO_HOST: 127.0.0.1
  HARNESS_METRO_BIND_HOST: 127.0.0.1
  HARNESS_SIMCAM: "1"
  SIMCAM_SOURCE_IMAGE: apps/simple-camera/src/assets/simcam-harness-source.png
  DERIVED_DATA_PATH: build/harness/DerivedData

jobs:
  test-ios-simcam:
    name: Test iOS Simulator With SimCam
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          bundler-cache: true
          working-directory: apps/simple-camera

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Install Skia binaries
        run: npx install-skia

      # RN's artifact probe can silently fall back to a newer Hermes source
      # commit. Use the exact Debug release from the successful baseline.
      - name: Download pinned Hermes binary
        id: hermes
        timeout-minutes: 10
        working-directory: apps/simple-camera
        env:
          HERMES_VERSION: "250829098.0.10"
          HERMES_TARBALL_SHA256: "6041a81b8d7147e9b532ff48d273cfc69d60827ecabe0d9e677c060fbaa1213e"
        run: |
          set -euo pipefail
          hermes_tag="$(node -p "require('node:fs').readFileSync(require('node:path').join(require('node:path').dirname(require.resolve('react-native/package.json')), 'sdks/.hermesv1version'), 'utf8').trim()")"
          if [ "$hermes_tag" != "hermes-v$HERMES_VERSION" ]; then
            echo "::error::Pinned Hermes $HERMES_VERSION does not match React Native's $hermes_tag."
            exit 1
          fi
          hermes_archive="$RUNNER_TEMP/hermes-ios-$HERMES_VERSION-debug.tar.gz"
          hermes_url="https://repo1.maven.org/maven2/com/facebook/hermes/hermes-ios/$HERMES_VERSION/hermes-ios-$HERMES_VERSION-hermes-ios-debug.tar.gz"
          echo "Downloading pinned Hermes Debug $HERMES_VERSION from $hermes_url"
          curl --fail --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 --retry-max-time 480 \
            --output "$hermes_archive" "$hermes_url"
          printf '%s  %s\n' "$HERMES_TARBALL_SHA256" "$hermes_archive" | shasum -a 256 -c -
          printf 'tarball=%s\n' "$hermes_archive" >> "$GITHUB_OUTPUT"

      - name: Install CocoaPods
        working-directory: apps/simple-camera
        env:
          HERMES_ENGINE_TARBALL_PATH: ${{ steps.hermes.outputs.tarball }}
        run: bundle exec pod install --project-directory=ios

      - name: Configure SimCam
        env:
          SIMCAM_LICENSE_TOKEN: ${{ secrets.SIMCAM_LICENSE_TOKEN }}
        run: |
          brew install --cask --appdir="$HOME/Applications" software-mansion/tap/simcam
          simcamctl license install-token "$SIMCAM_LICENSE_TOKEN"
          simcamctl set-source --image "$GITHUB_WORKSPACE/$SIMCAM_SOURCE_IMAGE" --fill

      - name: Build iOS app
        working-directory: apps/simple-camera/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace SimpleCamera.xcworkspace \
            -scheme SimpleCamera \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            build

      - name: Run isolated Skia test with diagnostics
        timeout-minutes: 40
        working-directory: apps/simple-camera
        env:
          HARNESS_DEBUG: "1"
        run: node scripts/run-skia-ci-diagnostics.mjs

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-ios-simcam-logs
          path: |
            apps/simple-camera/.harness/logs
            apps/simple-camera/.harness/crash-reports
            apps/simple-camera/ios/build/harness/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Skia diagnostics and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skia-diagnostics
          path: apps/simple-camera/.harness/skia-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
